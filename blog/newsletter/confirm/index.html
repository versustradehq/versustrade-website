<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Confirm your subscription | VersusTrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<script>try{var t=localStorage.getItem("vt-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{
  --red:#E11D2E;--red-dark:#B8101F;--red-tint:#FDECEE;
  --bg:#fff;--soft:#FAFAFA;--text:#1A1A1A;--muted:#6B6B6B;--line:#EDEDED;--pill:#F3F3F3;
  --header-h:64px;--logo-text:#000;
  --font:"Inter",system-ui,"Segoe UI",Roboto,Ubuntu,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{--bg:#121212;--soft:#171717;--text:#F5F5F5;--muted:#A3A3A3;--line:#2A2A2A;--pill:#232323;--red-tint:#2E1519;--logo-text:#fff;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--soft:#171717;--text:#F5F5F5;--muted:#A3A3A3;--line:#2A2A2A;--pill:#232323;--red-tint:#2E1519;--logo-text:#fff;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html{padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* Header: floating glass pills */
.vt-header{position:fixed;left:0;right:0;z-index:100;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:none}
.vt-bar{max-width:1200px;margin:0 auto;padding:0 24px;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.pill{pointer-events:auto;display:flex;align-items:center;height:40px;border-radius:999px;background:color-mix(in srgb,var(--bg) 38%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 24px -8px rgba(0,0,0,.18)}
:root[data-theme="dark"] .pill{border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px -8px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px -8px rgba(0,0,0,.5)}}
.vt-logo{justify-self:start;gap:8px;padding:0 16px 0 9px;line-height:1}
.vt-logo img{height:26px;width:26px;object-fit:contain;display:block;flex-shrink:0}
.vt-logo span{display:block;font-weight:700;font-size:17px;line-height:1;letter-spacing:-.02em;color:var(--logo-text);padding-bottom:1px}
.vt-nav{justify-self:center;padding:4px;gap:2px}
.vt-nav a{display:flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.vt-nav a:hover{background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)}
.vt-nav a[aria-current="page"]{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
.vt-actions{justify-self:end;display:flex;align-items:center;gap:8px;pointer-events:none}
.vt-login{padding:0 16px;font-size:14px;font-weight:500}
.vt-login:hover{color:var(--red)}
.vt-signup{pointer-events:auto;display:flex;align-items:center;height:40px;padding:0 18px;font-size:14px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;transition:background .15s}
.vt-signup:hover{background:var(--red-dark)}
.vt-icon{width:40px;justify-content:center}
.vt-icon:hover{border-color:var(--red)}
.vt-icon svg{width:18px;height:18px}
/* Header: soft backdrop appears once the page scrolls, so text never shows between the pills */
.vt-header::before{content:"";position:absolute;left:0;right:0;top:calc(-12px - env(safe-area-inset-top,0px));height:96px;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 0,color-mix(in srgb,var(--bg) 94%,transparent) 55%,transparent);opacity:0;transition:opacity .25s}
.vt-header.scrolled::before{opacity:1}
.vt-menu{display:none}
.vt-sheet{display:none;pointer-events:auto;position:absolute;left:24px;right:24px;top:64px;padding:8px;border-radius:20px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.14)}
.vt-sheet.open{display:block}
.vt-sheet a{display:block;padding:12px 14px;border-radius:12px;font-weight:600}
.vt-sheet a:hover{background:var(--pill)}
@media (max-width:760px){
  .vt-bar{display:flex;justify-content:space-between}
  .vt-nav,.vt-login{display:none}
  .vt-menu{display:flex}
  .vt-actions{margin-left:auto}
}



/* Confirmation page */
body{min-height:100vh;display:flex;flex-direction:column}
.cnf{flex:1;display:grid;place-items:center;padding:140px 24px 72px;background:radial-gradient(520px 260px at 10% 6%,color-mix(in srgb,#2BB673 22%,transparent),transparent 70%),
  radial-gradient(560px 260px at 70% 0%,color-mix(in srgb,var(--red) 18%,transparent),transparent 70%),var(--soft)}
.cnf-card{width:100%;max-width:520px;padding:40px 32px;border:1px solid var(--line);border-radius:24px;background:var(--bg);text-align:center;box-shadow:0 24px 60px -32px rgba(0,0,0,.3)}
.cnf-ico{width:56px;height:56px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:var(--red-tint);color:var(--red)}
.cnf-ico svg{width:26px;height:26px}
.cnf-card h1{font-size:28px;line-height:1.15;font-weight:900;letter-spacing:-.04em}
.cnf-card p{margin-top:12px;color:var(--muted);line-height:1.65}
.cnf-btns{margin-top:28px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.cnf-btn{padding:13px 26px;border-radius:999px;border:1px solid var(--text);font-weight:700;font-size:15px;transition:background .15s,border-color .15s,color .15s}
.cnf-btn.red{background:var(--red);border-color:var(--red);color:#fff}
.cnf-btn.red:hover{background:var(--red-dark)}
.cnf-btn:not(.red):hover{border-color:var(--red);color:var(--red)}
.cnf-btn:disabled{opacity:.6;cursor:not-allowed}
.cnf-btn[hidden]{display:none}
.cnf-foot{padding:24px;text-align:center;font-size:13px;color:var(--muted)}
.cnf-foot a{margin:0 10px}.cnf-foot a:hover{color:var(--text)}
/* Scroll reveal: blocks slide up 100px and fade in (0.8s, ease-out, 0.08s stagger), like AnimatedContent */
.rv-on [data-rv]{opacity:0;transform:translate3d(0,100px,0)}
.rv-on [data-rv].rv-in{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.215,.61,.355,1) var(--rv-d,0s),transform .8s cubic-bezier(.215,.61,.355,1) var(--rv-d,0s)}
.rv-on [data-rv].rv-now{transition:none!important}
</style>
</head>
<body>
<header class="vt-header" id="vtHeader">
  <div class="vt-bar">
    <a class="pill vt-logo" href="/" aria-label="VersusTrade home">
      <img src="https://pub-d09b462a1f3c4a8c8b73f79bcf29c60e.r2.dev/REAL%20LOGO%20%20VERSUSTRADE.png" alt="" width="26" height="26">
      <span>VersusTrade</span>
    </a>
    <nav class="pill vt-nav" aria-label="Main">
      <a href="/">Home</a>
      <a href="/#markets">Buy &amp; sell</a>
      <a href="/blog/">Blog</a>
      <a href="/support/">Support</a>
    </nav>
    <div class="vt-actions">
      <a class="pill vt-login" href="/login/">Log in</a>
      <a class="vt-signup" href="/signup/">Sign up</a>
      <button class="pill vt-icon" id="vtTheme" type="button" aria-label="Toggle light or dark theme"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6L16 16M4 16l1.4-1.4M14.6 5.4L16 4"/></svg></button>
      <button class="pill vt-icon vt-menu" id="vtMenu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="vtSheet"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 14h14"/></svg></button>
    </div>
    <div class="vt-sheet" id="vtSheet">
      <a href="/">Home</a><a href="/#markets">Buy &amp; sell</a><a href="/blog/">Blog</a><a href="/support/">Support</a><a href="/login/">Log in</a>
    </div>
  </div>
</header>
<main class="cnf">
  <div class="cnf-card" id="cCard" aria-live="polite">
    <div class="cnf-ico" id="cIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></div>
    <h1 id="cTitle">Confirm your subscription</h1>
    <p id="cText">One last step. Tap the button to start getting VersusTrade guides and updates.</p>
    <div class="cnf-btns">
      <button class="cnf-btn red" id="cBtn" type="button">Confirm subscription</button>
      <a class="cnf-btn" id="cLink" href="/blog/" hidden>Read the blog</a>
    </div>
  </div>
</main>
<footer class="cnf-foot"><a href="/legal/#privacy">Privacy</a><a href="/legal/#terms">Terms</a><a href="/blog/">Blog</a></footer>
<script>
var $ = function (id) { return document.getElementById(id); };
var ICONS = { mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>', check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>', alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>' };
var STATES = {
  ask:     { icon: 'mail',  title: 'Confirm your subscription', text: 'One last step. Tap the button to start getting VersusTrade guides and updates.', btn: 'Confirm subscription' },
  busy:    { icon: 'mail',  title: 'Confirming\u2026', text: 'Just a moment.', btn: 'Confirming\u2026', disabled: true },
  ok:      { icon: 'check', title: 'You\u2019re subscribed', text: 'Thanks for joining. Our next guide will land in your inbox, and every email has an unsubscribe link at the bottom.', link: 'Read the blog' },
  expired: { icon: 'alert', title: 'This link has expired', text: 'Confirmation links last 48 hours. Subscribe again from the blog and we\u2019ll send you a new one.', link: 'Back to the blog' },
  invalid: { icon: 'alert', title: 'This link isn\u2019t valid', text: 'Make sure you opened the full link from the email, or subscribe again from the blog.', link: 'Back to the blog' },
  error:   { icon: 'alert', title: 'Something went wrong', text: 'We couldn\u2019t confirm your subscription. Please try again.', btn: 'Try again' }
};
function show(k) {
  var s = STATES[k];
  $('cIco').innerHTML = ICONS[s.icon]; $('cTitle').textContent = s.title; $('cText').textContent = s.text;
  var b = $('cBtn'), l = $('cLink');
  b.hidden = !s.btn; b.textContent = s.btn || ''; b.disabled = !!s.disabled;
  l.hidden = !s.link; l.textContent = s.link || '';
}
var token = new URLSearchParams(location.search).get('t');
show(token ? 'ask' : 'invalid');
$('cBtn').addEventListener('click', function () {
  if (!token) return;
  show('busy');
  fetch('/api/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok && d.ok, reason: d.reason }; }); })
    .then(function (res) {
      if (res.ok) { try { history.replaceState(null, '', location.pathname); } catch (e) {} token = null; show('ok'); }
      else show(res.reason === 'expired' ? 'expired' : res.reason === 'invalid' ? 'invalid' : 'error');
    })
    .catch(function () { show('error'); });
});
// Header: theme toggle, mobile menu, backdrop on scroll
(function () {
  var h = $('vtHeader'); function f() { h.classList.toggle('scrolled', window.scrollY > 8); } f(); window.addEventListener('scroll', f, { passive: true });
  $('vtTheme').addEventListener('click', function () {
    var r = document.documentElement, dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    var next = dark ? 'light' : 'dark'; r.setAttribute('data-theme', next); try { localStorage.setItem('vt-theme', next); } catch (x) {}
  });
  var mb = $('vtMenu'), sh = $('vtSheet');
  mb.addEventListener('click', function () { var o = sh.classList.toggle('open'); mb.setAttribute('aria-expanded', o ? 'true' : 'false'); });
})();
</script>
<script>
// Scroll reveal: each block slides up 100px and fades in (0.8s, ease-out); blocks that appear together are staggered by 0.08s.
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if (!('IntersectionObserver' in window)) return;
  var SEL = ['.bh .wrap > *', '.side > *', '.feed > .post', '.pager', '.cnf-card',
    '.art-head > *', '.hero-cover', '.toc', '.prose > *', '.cta-card', '.rel-top', '.rel-card', '.disc',
    '.ft-news', '.ft-left', '.ft-right > *', '.ft-credits', '.risk'].join(',');
  var STAGGER = 0.08, MAXD = 0.64, DUR = 800;
  document.documentElement.classList.add('rv-on');
  function show(el, d, instant) {
    el.style.setProperty('--rv-d', d + 's');
    if (instant) el.classList.add('rv-now');
    el.classList.add('rv-in');
    setTimeout(function () { el.removeAttribute('data-rv'); el.classList.remove('rv-in', 'rv-now'); el.style.removeProperty('--rv-d'); }, instant ? 40 : DUR + d * 1000 + 80);
  }
  var io = new IntersectionObserver(function (entries) {
    entries.filter(function (e) { return e.isIntersecting; })
      .sort(function (a, b) { return (a.boundingClientRect.top - b.boundingClientRect.top) || (a.boundingClientRect.left - b.boundingClientRect.left); })
      .forEach(function (e, i) { show(e.target, Math.min(i * STAGGER, MAXD)); io.unobserve(e.target); });
    entries.forEach(function (e) { // scrolled or jumped past it without seeing it: just show it
      if (!e.isIntersecting && e.boundingClientRect.top < 0 && e.target.hasAttribute('data-rv')) { show(e.target, 0, true); io.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  function scan() {
    [].forEach.call(document.querySelectorAll(SEL), function (el) { if (el.__rv) return; el.__rv = true; el.setAttribute('data-rv', ''); io.observe(el); });
  }
  scan();
  var t; new MutationObserver(function () { clearTimeout(t); t = setTimeout(scan, 30); }).observe(document.body, { childList: true, subtree: true });
})();
</script>
