<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="description" content="Access your secure VersusTrade account.">
<title>Sign in | VersusTrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
<script>(function(){try{var t=localStorage.getItem('vt-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<script src="/auth-page.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
 var b=document.getElementById('authTheme');if(!b)return;
 function sync(){var light=document.documentElement.getAttribute('data-theme')==='light';b.querySelector('.auth-theme-label').textContent=light?'Dark mode':'Light mode';b.querySelector('.auth-theme-icon').textContent=light?'☼':'◐';}
 b.addEventListener('click',function(){var next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('vt-theme',next)}catch(e){}sync();});sync();
});
</script>
</body></html>
