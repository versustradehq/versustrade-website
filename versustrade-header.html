<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VersusTrade</title>
<!-- Google Sans is not served by Google Fonts. Self-host it for exact match (see @font-face below).
     Outfit is the closest free Google Fonts match and loads as the fallback. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Self-hosting Google Sans? Uncomment and point to your files.
@font-face{font-family:"Google Sans";src:url("/fonts/GoogleSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Google Sans";src:url("/fonts/GoogleSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Google Sans";src:url("/fonts/GoogleSans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
*/
:root{
  --red:#E11D2E; --red-dark:#B8101F; --red-tint:#FDECEE;
  --bg:#FFFFFF; --text:#1A1A1A; --muted:#6B6B6B; --line:#EDEDED; --pill:#F3F3F3;
  --header-h:64px;
  --font:"Google Sans","Google Sans Text","Product Sans","Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121212; --text:#F5F5F5; --muted:#A3A3A3; --line:#2A2A2A; --pill:#232323; --red-tint:#2E1519;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --text:#F5F5F5; --muted:#A3A3A3; --line:#2A2A2A; --pill:#232323; --red-tint:#2E1519;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* ---------- Header ---------- */
.vt-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--bg);border-bottom:1px solid var(--line)}
.vt-bar{max-width:1440px;margin:0 auto;height:var(--header-h);padding:0 24px;display:flex;align-items:center;gap:20px}

.vt-logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.vt-logo svg{width:28px;height:28px;display:block}
.vt-logo span{font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--red)}

/* Segmented toggle */
.vt-switch{display:flex;background:var(--pill);border-radius:10px;padding:2px;flex-shrink:0}
.vt-switch a{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);border:1px solid transparent}
.vt-switch a[aria-current="page"]{color:var(--text);background:var(--bg);border-color:var(--text)}

/* Nav */
.vt-nav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.vt-nav>a,.vt-more>button{display:flex;align-items:center;gap:4px;padding:8px 12px;font-size:14px;font-weight:500;border-radius:8px;white-space:nowrap}
.vt-nav>a:hover,.vt-more>button:hover{color:var(--red)}
.vt-more{position:relative}
.vt-more svg{width:10px;height:10px;transition:transform .15s}
.vt-more.open svg{transform:rotate(180deg)}
.vt-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.vt-more.open .vt-menu{display:block}
.vt-menu a{display:block;padding:10px 12px;border-radius:8px;font-size:14px}
.vt-menu a:hover{background:var(--red-tint);color:var(--red)}

/* Actions */
.vt-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.vt-login{padding:8px 14px;font-size:14px;font-weight:500;border-radius:999px}
.vt-login:hover{color:var(--red)}
.vt-signup{padding:9px 18px;font-size:14px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;transition:background .15s}
.vt-signup:hover{background:var(--red-dark)}
.vt-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.vt-icon:hover{background:var(--pill)}
.vt-icon svg{width:18px;height:18px}
.vt-burger{display:none}

/* Mobile drawer */
.vt-drawer{display:none;border-top:1px solid var(--line);padding:8px 16px 20px;background:var(--bg)}
.vt-drawer a{display:block;padding:14px 4px;font-size:16px;font-weight:500;border-bottom:1px solid var(--line)}
.vt-drawer .vt-login{display:block;text-align:center;margin-top:16px;border:1px solid var(--line);border-radius:999px;border-bottom:1px solid var(--line)}
.vt-header.menu-open .vt-drawer{display:block}

@media (max-width:1023px){
  :root{--header-h:56px}
  .vt-bar{padding:0 16px;gap:10px}
  .vt-nav,.vt-actions .vt-login,.vt-actions .vt-hide-m{display:none}
  .vt-logo svg{width:24px;height:24px}
  .vt-logo span{font-size:17px}
  .vt-signup{padding:8px 14px;font-size:13px}
  .vt-burger{display:grid}
}
@media (max-width:380px){ .vt-switch{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="vt-header" id="vtHeader">
  <div class="vt-bar">
    <a class="vt-logo" href="/" aria-label="VersusTrade home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#E11D2E"/>
        <path d="M7 9l9 15 9-15h-4.6L16 16.6 11.6 9z" fill="#fff"/>
      </svg>
      <span>VERSUSTRADE</span>
    </a>

    <div class="vt-switch" role="group" aria-label="Section">
      <a href="/" aria-current="page">Trade</a>
      <a href="/blog/">Learn</a>
    </div>

    <nav class="vt-nav" aria-label="Main">
      <a href="/#markets">Markets</a>
      <a href="/#features">Features</a>
      <a href="/blog/">Blog</a>
      <a href="/support/">Support</a>
      <div class="vt-more" id="vtMore">
        <button type="button" aria-haspopup="true" aria-expanded="false">
          More
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"/></svg>
        </button>
        <div class="vt-menu">
          <a href="/about/">About us</a>
          <a href="https://wa.me/YOURNUMBER?text=Hi%20VersusTrade" target="_blank" rel="noopener">Chat on WhatsApp</a>
          <a href="/legal/#terms">Terms of use</a>
          <a href="/legal/#privacy">Privacy policy</a>
          <a href="/legal/#risk">Risk disclosure</a>
        </div>
      </div>
    </nav>

    <div class="vt-actions">
      <a class="vt-login" href="/login/">Log in</a>
      <a class="vt-signup" href="/signup/">Sign up</a>
      <button class="vt-icon vt-hide-m" type="button" aria-label="Search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
      </button>
      <button class="vt-icon vt-hide-m" type="button" aria-label="Language">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M2 10h16M10 2c2.5 2.3 3.5 5 3.5 8S12.500 15.700 10 18c-2.500-2.300-3.500-5-3.500-8S7.500 4.300 10 2z"/></svg>
      </button>
      <button class="vt-icon" id="vtTheme" type="button" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.500v2M10 16.500v2M1.500 10h2M16.500 10h2M4 4l1.400 1.400M14.600 14.600L16 16M4 16l1.400-1.400M14.600 5.400L16 4"/></svg>
      </button>
      <button class="vt-icon vt-burger" id="vtBurger" type="button" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h14M3 14h14"/></svg>
      </button>
    </div>
  </div>

  <div class="vt-drawer" id="vtDrawer">
    <a href="/#markets">Markets</a>
    <a href="/#features">Features</a>
    <a href="/blog/">Blog</a>
    <a href="/support/">Support</a>
    <a href="https://wa.me/YOURNUMBER?text=Hi%20VersusTrade" target="_blank" rel="noopener">Chat on WhatsApp</a>
    <a href="/legal/">Legal</a>
    <a class="vt-login" href="/login/">Log in</a>
  </div>
</header>

<script>
(function () {
  var root = document.documentElement;
  var header = document.getElementById('vtHeader');
  var burger = document.getElementById('vtBurger');
  var more = document.getElementById('vtMore');
  var moreBtn = more.querySelector('button');

  // "More" dropdown
  function setMore(open) {
    more.classList.toggle('open', open);
    moreBtn.setAttribute('aria-expanded', open);
  }
  moreBtn.addEventListener('click', function (e) { e.stopPropagation(); setMore(!more.classList.contains('open')); });
  document.addEventListener('click', function () { setMore(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMore(false); });

  // Mobile drawer
  burger.addEventListener('click', function () {
    var open = header.classList.toggle('menu-open');
    burger.setAttribute('aria-expanded', open);
  });

  // Theme toggle (remembered when storage is available)
  try { var saved = localStorage.getItem('vt-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('vtTheme').addEventListener('click', function () {
    var isDark = getComputedStyle(root).colorScheme === 'dark';
    var next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('vt-theme', next); } catch (e) {}
  });
})();
</script>
</body>
</html>
